<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký quản trị</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: Inter, system-ui, sans-serif; color: #1c1917; background: #f4f1eb; }
      .split { min-height: 100vh; display: grid; grid-template-columns: 1.15fr 0.85fr; }
      .story { background: #1c1917; color: #fafaf9; padding: 48px 56px; display: flex; flex-direction: column; justify-content: space-between; }
      .mark { width: 42px; height: 42px; border-radius: 10px; background: #fafaf9; color: #1c1917; display: grid; place-items: center; font-family: Fraunces, Georgia, serif; font-size: 22px; }
      .story h1 { font-family: Fraunces, Georgia, serif; font-weight: 560; font-size: clamp(36px, 4vw, 56px); line-height: 1.05; letter-spacing: -0.03em; margin: 28px 0 12px; max-width: 12ch; }
      .story p { margin: 0; color: #d6d3d1; max-width: 36ch; font-size: 16px; }
      .fine { color: #a8a29e; font-size: 12px; }
      .form-side { display: flex; align-items: center; justify-content: center; padding: 32px 24px; }
      .card { width: min(400px, 100%); }
      h2 { margin: 0; font-size: 24px; letter-spacing: -0.03em; }
      .desc { color: #78716c; font-size: 14px; margin-top: 6px; }
      label { display: block; margin-top: 14px; margin-bottom: 6px; font-size: 12px; font-weight: 650; }
      input { width: 100%; padding: 12px 14px; border: 1px solid #d6d3d1; border-radius: 10px; background: #fff; font-size: 14px; }
      input:focus { outline: none; border-color: #1c1917; box-shadow: 0 0 0 3px rgba(28,25,23,.08); }
      button { width: 100%; margin-top: 18px; padding: 12px 14px; background: #1c1917; color: #fff; border: 0; border-radius: 10px; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      .spinner { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; vertical-align: -2px; margin-right: 8px; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .muted { color: #b91c1c; font-size: 13px; min-height: 18px; margin-top: 12px; }
      .small { font-size: 13px; color: #78716c; margin-top: 16px; }
      .link { color: #1c1917; font-weight: 650; }
      @media (max-width: 860px) {
        .split { grid-template-columns: 1fr; }
        .story { padding: 28px 22px; }
        .story h1 { font-size: 34px; }
        .fine { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="split">
      <section class="story">
        <div>
          <div class="mark">R</div>
          <h1>Tài khoản chỉ dành cho quản trị.</h1>
          <p>Cần mã bí mật admin. Sau khi tạo, bạn vào thẳng bảng điều khiển.</p>
        </div>
        <div class="fine">Reader Admin</div>
      </section>
      <section class="form-side">
        <div class="card">
          <h2>Đăng ký admin</h2>
          <div class="desc">Email, họ tên, mật khẩu và mã bí mật.</div>
          <label for="email">Email</label>
          <input id="email" autocomplete="email" />
          <label for="name">Họ và tên</label>
          <input id="name" />
          <label for="password">Mật khẩu</label>
          <input id="password" type="password" autocomplete="new-password" />
          <label for="secret">Mã bí mật admin</label>
          <input id="secret" />
          <button id="btn">Đăng ký</button>
          <div id="msg" class="muted"></div>
          <div class="small">Đã có tài khoản? <a class="link" href="/login.html">Đăng nhập</a></div>
        </div>
      </section>
    </main>
    <script>
      const API_BASE = (new URLSearchParams(location.search)).get('api') || '/';
      function setLoading(btn, loading){
        if (!btn) return
        if (loading){
          btn.disabled = true
          btn.dataset.orig = btn.textContent
          btn.innerHTML = '<span class="spinner"></span>' + btn.dataset.orig
        } else {
          btn.disabled = false
          if (btn.dataset.orig) btn.textContent = btn.dataset.orig
        }
      }

      async function register() {
        const btn = document.getElementById('btn')
        const email = document.getElementById('email').value.trim()
        const name = document.getElementById('name').value.trim()
        const password = document.getElementById('password').value
        const secret = document.getElementById('secret').value
        const target = (API_BASE.endsWith('/')?API_BASE.slice(0,-1):API_BASE) + '/auth/register-admin'
        setLoading(btn, true)
        try {
          const res = await fetch(target, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,name,password,secret}) })
          const data = await res.json()
          if (data && data.id) {
            if (data.token) localStorage.setItem('admin_token', data.token)
            setTimeout(()=> location.href = '/', 220)
            return
          }
          document.getElementById('msg').innerText = data.error || 'Đăng ký thất bại'
        } catch (err) {
          document.getElementById('msg').innerText = 'Không thể kết nối tới server'
        } finally {
          setLoading(btn, false)
        }
      }
      document.getElementById('btn').addEventListener('click', register)
    </script>
  </body>
</html>
